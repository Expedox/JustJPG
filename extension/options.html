<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="opt.title">JustJPG Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <header class="top">
    <div class="brand"><img src="icons/icon48.png" alt="" width="36" height="36">
      <div><h1>JustJPG</h1><p class="muted" data-i18n="opt.tagline"></p></div>
    </div>
    <div class="top-right">
      <label class="lang">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        <span class="sr" data-i18n="opt.language"></span>
        <select data-key="language" id="language"></select>
      </label>
      <span id="saved" class="saved" aria-live="polite"></span>
    </div>
  </header>

  <main>
    <section>
      <h2 data-i18n="opt.secTriggers"></h2>
      <label class="row"><input type="checkbox" data-key="contextMenu">
        <span><b data-i18n="opt.contextMenu"></b><small data-i18n="opt.contextMenuHint"></small></span></label>
      <label class="row"><input type="checkbox" data-key="unblockContextMenu">
        <span><b data-i18n="opt.unblock"></b><small data-i18n="opt.unblockHint"></small></span></label>
      <label class="row"><input type="checkbox" data-key="hoverButton">
        <span><b data-i18n="opt.hover"></b><small data-i18n="opt.hoverHint"></small></span></label>
      <div class="sub" data-show="hoverButton">
        <label><span data-i18n="opt.position"></span>
          <select data-key="hoverPosition">
            <option value="top-right" data-i18n="opt.posTopRight"></option>
            <option value="top-left" data-i18n="opt.posTopLeft"></option>
            <option value="bottom-right" data-i18n="opt.posBottomRight"></option>
            <option value="bottom-left" data-i18n="opt.posBottomLeft"></option>
          </select>
        </label>
        <label><span data-i18n="opt.hoverMin"></span> <input type="number" data-key="hoverMinSize" min="0" max="2000" step="10"> px</label>
      </div>
      <div class="row static">
        <span><b data-i18n="opt.shortcuts"></b><small id="shortcuts">...</small></span>
        <button id="editShortcuts" type="button" data-i18n="opt.change"></button>
      </div>
      <div class="row static">
        <span><b data-i18n="opt.gallery"></b><small data-i18n="opt.galleryHint"></small></span>
      </div>
    </section>

    <section>
      <h2 data-i18n="opt.secSaving"></h2>
      <div class="row radio">
        <label><input type="radio" name="saveMode" value="direct" data-key="saveMode"> <span><b data-i18n="opt.direct"></b><small data-i18n="opt.directHint"></small></span></label>
        <label><input type="radio" name="saveMode" value="ask" data-key="saveMode"> <span><b data-i18n="opt.ask"></b><small data-i18n="opt.askHint"></small></span></label>
      </div>
      <label class="field"><span data-i18n="opt.subfolder"></span>
        <input type="text" data-key="subfolder" data-i18n-placeholder="opt.subfolderPlaceholder">
        <small data-i18n-html="opt.subfolderHint"></small>
      </label>
      <label class="field"><span data-i18n="opt.conflict"></span>
        <select data-key="conflictAction">
          <option value="uniquify" data-i18n="opt.conflictUniquify"></option>
          <option value="overwrite" data-i18n="opt.conflictOverwrite"></option>
        </select>
      </label>
      <p class="hint" data-i18n="opt.chromeAskHint"></p>
    </section>

    <section>
      <h2 data-i18n="opt.secQuality"></h2>
      <label class="field"><span><span data-i18n="opt.quality"></span> <b><output id="qualityOut"></output> %</b></span>
        <input type="range" data-key="quality" min="50" max="100" step="1">
      </label>
      <label class="field inline"><span data-i18n="opt.background"></span>
        <input type="color" data-key="background">
        <button type="button" class="chip" data-color="#ffffff" data-i18n="opt.white"></button>
        <button type="button" class="chip" data-color="#000000" data-i18n="opt.black"></button>
      </label>
      <label class="row"><input type="checkbox" data-key="keepJpeg">
        <span><b data-i18n="opt.keepJpeg"></b><small data-i18n="opt.keepJpegHint"></small></span></label>
      <label class="row"><input type="checkbox" data-key="preferLargest">
        <span><b data-i18n="opt.largest"></b><small data-i18n="opt.largestHint"></small></span></label>
      <label class="row"><input type="checkbox" data-key="screenshotFallback">
        <span><b data-i18n="opt.screenshot"></b><small data-i18n="opt.screenshotHint"></small></span></label>
    </section>

    <section>
      <h2 data-i18n="opt.secFilename"></h2>
      <label class="field"><span data-i18n="opt.template"></span>
        <select id="preset"></select>
      </label>
      <label class="field"><span data-i18n="opt.pattern"></span>
        <input type="text" data-key="filenameTemplate" id="template" spellcheck="false">
      </label>
      <div class="chips" id="placeholders" data-i18n-aria-label="opt.insertPlaceholder"></div>
      <div class="preview"><span class="muted" data-i18n="opt.preview"></span> <code id="preview"></code></div>

      <label class="row"><input type="checkbox" data-key="crypticFallback">
        <span><b data-i18n="opt.cryptic"></b><small data-i18n-html="opt.crypticHint"></small></span></label>
      <label class="field sub" data-show="crypticFallback"><span data-i18n="opt.fallback"></span>
        <input type="text" data-key="fallbackTemplate" spellcheck="false">
      </label>
      <div class="grid2">
        <label class="field"><span data-i18n="opt.spaces"></span>
          <select data-key="spaceReplacement">
            <option value="_" data-i18n="opt.spaceUnderscore"></option>
            <option value="-" data-i18n="opt.spaceDash"></option>
            <option value=" " data-i18n="opt.spaceKeep"></option>
          </select>
        </label>
        <label class="field"><span data-i18n="opt.maxLength"></span>
          <input type="number" data-key="maxNameLength" min="10" max="200">
        </label>
      </div>
      <label class="row"><input type="checkbox" data-key="lowercase">
        <span><b data-i18n="opt.lowercase"></b></span></label>
      <div class="row static">
        <span><b data-i18n="opt.counter"></b><small><span data-i18n-html="opt.counterHint"></span> <span id="counter">1</span></small></span>
        <button id="resetCounter" type="button" data-i18n="opt.resetCounter"></button>
      </div>
    </section>

    <section>
      <h2 data-i18n="opt.secDisplay"></h2>
      <label class="row"><input type="checkbox" data-key="showToast">
        <span><b data-i18n="opt.toast"></b><small data-i18n="opt.toastHint"></small></span></label>
      <label class="field"><span data-i18n="opt.thumbSize"></span>
        <input type="number" data-key="galleryThumbSize" min="70" max="260" step="10">
      </label>
      <label class="field"><span data-i18n="opt.galleryMin"></span>
        <input type="number" data-key="galleryMinSize" min="0" max="2000" step="10">
      </label>
    </section>

    <footer class="bottom">
      <button id="reset" type="button" class="danger" data-i18n="opt.resetAll"></button>
      <span class="muted" data-i18n="opt.heicNote"></span>
    </footer>
  </main>

  <script src="translations.js"></script>
  <script src="lib/i18n.js"></script>
  <script src="lib/defaults.js"></script>
  <script src="options.js"></script>
</body>
</html>
