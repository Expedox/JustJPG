name: Build

# Builds the Chrome Web Store zip on every push. Pushing a tag like v1.0.1
# also creates a GitHub release with the zip attached.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check and pack extension
        run: node scripts/build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: justjpg-zip
          path: dist/*.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
